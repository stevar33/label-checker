<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>原料標籤自動檢核 (全畫面辨識)</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #111; color: #fff; margin: 0; padding: 10px; }
        h3 { margin: 5px 0; font-size: 18px; }
        .config-box { background: #333; padding: 10px; border-radius: 8px; margin-bottom: 10px; text-align: left; }
        label { font-size: 14px; color: #ccc; }
        input { padding: 6px; width: calc(100% - 14px); margin-top: 2px; margin-bottom: 6px; font-size: 15px; }
        video, canvas { width: 100%; max-width: 400px; border-radius: 8px; border: 2px solid #555; display: block; margin: 0 auto; }
        #status { font-size: 20px; font-weight: bold; margin-top: 10px; padding: 12px; border-radius: 8px; }
        .pass { background-color: #2e7d32; color: #fff; }
        .fail { background-color: #c62828; color: #fff; }
        .scanning { background-color: #455a64; color: #fff; }
    </style>
    <!-- 引入 Tesseract.js 用於文字辨識 (OCR) -->
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
</head>
<body>

    <h3>原料標籤自動檢核</h3>
    
    <!-- 設定當批次的標準資料 -->
    <div class="config-box">
        <label>預期批號 (Lot No.):</label>
        <input type="text" id="targetLot" value="ST40-2601">
        
        <label>預期製造日期 (Mfg. Date):</label>
        <input type="text" id="targetMfg" value="2026.10.13">
        
        <label>預期重驗日期 (Retesting Date):</label>
        <input type="text" id="targetRetest" value="2031.10.12">
    </div>

    <!-- 手機相機畫面 -->
    <div>
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <div id="status" class="scanning">請將鏡頭對準標籤...</div>
    <div id="counter" style="margin-top: 8px; font-size: 16px; color: #aaa;">已連續通過張數: <span id="passCount">0</span></div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const statusDiv = document.getElementById('status');
        const passCountSpan = document.getElementById('passCount');

        let isProcessing = false;
        let successCount = 0;
        let lastPassedText = ""; 

        // 建立音效物件 (發出提示嗶聲)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'success') {
                osc.frequency.value = 880; // 高音成功提示
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15); 
            } else {
                osc.frequency.value = 300; 
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4); 
            }
        }

        // 自動啟動手機後鏡頭
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => { 
                video.srcObject = stream;
                video.play();
                // 每 1 秒自動掃描一次
                setInterval(scanLoop, 1000); 
            })
            .catch(err => { alert("無法開啟相機: " + err); });

        async function scanLoop() {
            if (isProcessing) return; 
            if (video.readyState !== video.HAVE_ENOUGH_DATA) return;

            isProcessing = true;

            try {
                // 直接抓取完整畫面進行辨識
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                const imageDataUrl = canvas.toDataURL('image/jpeg');

                const targetLot = document.getElementById('targetLot').value.trim();
                const targetMfg = document.getElementById('targetMfg').value.trim();
                const targetRetest = document.getElementById('targetRetest').value.trim();

                // 執行全畫面 OCR 辨識
                const { data: { text } } = await Tesseract.recognize(imageDataUrl, 'eng');

                const hasLot = text.includes(targetLot);
                const hasMfg = text.includes(targetMfg);
                const hasRetest = text.includes(targetRetest);

                if (hasLot && hasMfg && hasRetest) {
                    statusDiv.className = "pass";
                    statusDiv.innerText = `✅ PASS！三項皆正確\n(批號: ${targetLot})`;
                    
                    if (text !== lastPassedText) {
                        successCount++;
                        passCountSpan.innerText = successCount;
                        lastPassedText = text;
                        
                        playBeep('success');
                        if (navigator.vibrate) navigator.vibrate(200);
                    }
                } else {
                    statusDiv.className = "fail";
                    statusDiv.innerText = `⏳ 尋找中... 請對準標籤`;
                }
            } catch (err) {
                console.log("辨識中...");
            } finally {
                isProcessing = false;
            }
        }
    </script>
</body>
</html>
